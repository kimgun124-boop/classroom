<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#140f2e">
<title>🕹️ 우리반 오락실 · made by 효석쌤</title>
<meta name="author" content="효석쌤">
<!-- 이 파일은 arcade/build.py 가 만들어요. 고칠 때는 arcade 폴더의 파일을 고친 뒤 다시 만들어 주세요. -->
<link href="fonts/fonts.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<style>
/*{{CSS_APP}}*/
/*{{CSS_ARC}}*/
</style>
</head>
<body class="arc-body">

<!-- ===== 처음 설정 (선생님) ===== -->
<section class="arc-scr" id="scrSetup" hidden>
  <div class="arc-card arc-wide">
    <h1 class="arc-logo"><span class="e">🕹️</span> <span class="g">우리반 오락실</span></h1>
    <p class="arc-sub">선생님, 처음 한 번만 우리 반을 만들어 주세요.</p>
    <label class="arc-f">반 이름 <input id="suName" placeholder="예) 6학년 2반" maxlength="20"></label>
    <label class="arc-f">학생 명단 <small>한 줄에 한 명씩 "번호 이름" (이름 대신 별명도 좋아요)</small>
      <textarea id="suRoster" rows="8" placeholder="1 하늘&#10;2 바다&#10;3 별"></textarea></label>
    <label class="arc-f">선생님 비밀번호 <small>선생님 화면을 열 때 써요 (숫자 4자리 이상)</small>
      <input id="suPin" inputmode="numeric" maxlength="8" placeholder="숫자 4자리 이상"></label>
    <div class="arc-f">기록 저장 방법
      <div class="arc-seg" id="suMode"><button data-v="local" class="on">💻 이 기기에만</button><button data-v="cloud">☁️ 반 전체 함께 (Firebase)</button></div>
      <small id="suModeHelp"></small>
    </div>
    <label class="arc-f" id="suCfgBox" hidden>Firebase 설정 붙여넣기 <small>Firebase 콘솔의 웹 앱 설정(<code>const firebaseConfig = {...}</code>)을 통째로 붙여 넣어요</small>
      <textarea id="suCfg" rows="6" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", ... };'></textarea></label>
    <div class="arc-row"><button class="arc-btn p" id="suGo">🎮 오락실 만들기</button></div>
    <p class="arc-credit in">✋ made by 효석쌤</p>
    <p class="arc-small">이미 다른 기기에서 만들었다면, 선생님 화면의 <b>🔗 반 입장 주소</b>로 열어 주세요.</p>
  </div>
</section>

<!-- ===== 로그인 ===== -->
<section class="arc-scr" id="scrLogin" hidden>
  <div class="arc-marquee"><h1 class="arc-logo"><span class="e">🕹️</span> <span class="g"><span id="lgClass">우리반</span> 오락실</span></h1><p class="arc-sub">내 번호를 누르고 비밀번호를 입력해요</p></div>
  <div class="arc-nums" id="lgNums"></div>
  <button class="arc-teach" id="lgTeach" title="선생님 화면">⚙️ 선생님</button>
  <div class="arc-sync" id="lgSync"></div>
  <div class="arc-credit">🕹️ 우리반 오락실 · made by <b>효석쌤</b></div>
</section>

<!-- ===== 홈 ===== -->
<section class="arc-scr" id="scrHome" hidden>
  <header class="arc-top">
    <div class="arc-me" id="hmMe"></div>
    <h1 class="arc-logo sm"><span class="e">🕹️</span> <span class="g"><span id="hmClass">우리반</span> 오락실</span></h1>
    <div class="arc-topb"><button class="arc-btn" id="hmRank">🏆 랭킹</button><button class="arc-btn" id="hmFace">😀 캐릭터</button><button class="arc-btn" id="hmOut">🚪 로그아웃</button></div>
  </header>
  <div class="arc-games" id="hmGames"></div>
  <div class="arc-sync" id="hmSync"></div>
  <div class="arc-credit">🕹️ 우리반 오락실 · made by <b>효석쌤</b></div>
</section>

<!-- ===== 비밀번호 입력 / 상대 로그인 ===== -->
<div class="arc-modal" id="mdPw" hidden>
  <div class="arc-card arc-pw">
    <div class="arc-pwwho" id="pwWho"></div>
    <div class="arc-pwtitle" id="pwTitle">비밀번호</div>
    <div class="arc-nums sm" id="pwPick" hidden></div>
    <div class="arc-dots" id="pwDots"></div>
    <div class="arc-pad" id="pwPad"></div>
    <div class="arc-pwmsg" id="pwMsg"></div>
    <div class="arc-row" id="pwExtra"></div>
    <button class="arc-x" data-close>×</button>
  </div>
</div>

<!-- ===== 캐릭터 고르기 ===== -->
<div class="arc-modal" id="mdFace" hidden>
  <div class="arc-card arc-wide">
    <h2>😀 내 캐릭터 고르기</h2>
    <p class="arc-small">게임에서 내 얼굴로 나와요. 언제든 바꿀 수 있어요.</p>
    <div class="arc-faces" id="fcGrid"></div>
    <button class="arc-x" data-close>×</button>
  </div>
</div>

<!-- ===== 대결 상대 ===== -->
<div class="arc-modal" id="mdDuel" hidden>
  <div class="arc-card arc-wide">
    <h2 id="duTitle">⚔️ 대결</h2>
    <div class="arc-duo" id="duDuo"></div>
    <div class="arc-row col">
      <button class="arc-btn p big" id="duFriend">🧒 친구와 대결 <small>상대도 번호·비밀번호로 들어와요 · 이기면 랭킹 1승!</small></button>
      <button class="arc-btn big" id="duCpu">🤖 컴퓨터와 연습 <small>랭킹에는 들어가지 않아요</small></button>
    </div>
    <div class="arc-seg" id="duLv"><button data-v="0">🐣 쉬움</button><button data-v="1" class="on">🐥 보통</button><button data-v="2">🦅 어려움</button></div>
    <p class="arc-small" id="duHelp"></p>
    <button class="arc-x" data-close>×</button>
  </div>
</div>

<!-- ===== 랭킹 ===== -->
<div class="arc-modal" id="mdRank" hidden>
  <div class="arc-card arc-wide arc-rankc">
    <h2>🏆 우리 반 랭킹</h2>
    <div class="arc-tabs" id="rkTabs"></div>
    <div class="arc-rlist" id="rkList"></div>
    <button class="arc-x" data-close>×</button>
  </div>
</div>

<!-- ===== 선생님 화면 ===== -->
<div class="arc-modal" id="mdTeach" hidden>
  <div class="arc-card arc-wide arc-teachc">
    <h2>⚙️ 선생님 화면</h2>
    <div class="arc-tabs" id="tcTabs"><button data-t="kids" class="on">👧 학생·비밀번호</button><button data-t="link">🔗 반 입장 주소</button><button data-t="rank">🏆 랭킹 관리</button><button data-t="store">☁️ 저장</button></div>
    <div id="tcBody"></div>
    <button class="arc-x" data-close>×</button>
  </div>
</div>

<!-- ===== 새 게임 화면 ===== -->
<div class="ng-ov" id="ng" hidden>
  <div class="ng-top"><h2 id="ngTitle"></h2><div class="ng-hud" id="ngHud"></div><button class="pk-x" id="ngClose" title="닫기">×</button></div>
  <div class="ng-stage" id="ngStage">
    <canvas id="ngCanvas"></canvas>
    <div class="ng-dom" id="ngDom"></div>
    <div class="ng-over" id="ngOver" hidden></div>
  </div>
</div>

<!-- 배구 태블릿 버튼 -->
<div class="vp" id="vpad" hidden>
  <div class="vp-side l" data-side="p1"><button data-k="KeyA">◀</button><button data-k="KeyD">▶</button><button data-k="KeyW" class="j">⤒<small>점프</small></button><button data-k="KeyF" class="s">💥<small>스파이크</small></button></div>
  <div class="vp-side r" data-side="p2"><button data-k="ArrowUp" class="j">⤒<small>점프</small></button><button data-k="Enter" class="s">💥<small>스파이크</small></button><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
</div>

<!-- 손들고 말해요에서 가져온 게임 화면 -->
<div hidden><button id="vbBtn"></button><button id="ahBtn"></button><button id="flBtn"></button><button id="trBtn"></button><button id="meBtn"></button><button id="gsBtn"></button></div>
<!--{{GAME_HTML}}-->

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undoBtn">되돌리기</button></div>

<script>
/*{{CORE_JS}}*/
</script>
<script>
/*{{GAME_JS}}*/
</script>
<script>
/*{{NEW_JS}}*/
</script>
<script>ARC.boot();</script>
</body>
</html>
